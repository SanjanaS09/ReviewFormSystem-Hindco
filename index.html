<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review System</title>
    <style>
        :root {
            --color-primary: #208C9E;
            --color-primary-hover: #1A7A8A;
            --color-background: #F5F5F2;
            --color-surface: #FFFFFF;
            --color-text: #1F2121;
            --color-text-secondary: #626C7C;
            --color-border: #E0E0E0;
            --color-success: #22C55E;
            --color-yellow: #FFD700;
            --space-8: 8px;
            --space-12: 12px;
            --space-16: 16px;
            --space-20: 20px;
            --space-24: 24px;
            --radius-base: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--color-background);
            color: var(--color-text);
            padding: var(--space-20);
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: var(--space-24);
        }

        .form-section {
            background-color: var(--color-surface);
            padding: var(--space-24);
            border-radius: var(--radius-base);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            height: fit-content;
        }

        h1 {
            font-size: 28px;
            margin-bottom: var(--space-24);
            color: var(--color-text);
        }

        h2 {
            font-size: 20px;
            margin-bottom: var(--space-16);
            color: var(--color-text);
            border-bottom: 2px solid var(--color-border);
            padding-bottom: var(--space-12);
        }

        .form-group {
            margin-bottom: var(--space-20);
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: var(--space-8);
            font-size: 14px;
            color: var(--color-text);
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: var(--space-12);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-base);
            font-family: inherit;
            font-size: 14px;
            color: var(--color-text);
            background-color: #FAFAFA;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(32, 140, 158, 0.1);
            background-color: var(--color-surface);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .rating-group {
            margin-bottom: var(--space-20);
        }

        .stars-container {
            display: flex;
            gap: var(--space-12);
            font-size: 32px;
            cursor: pointer;
        }

        .star {
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            color: #D3D3D3;
        }

        .star:hover,
        .star.active {
            color: var(--color-yellow);
            transform: scale(1.2);
        }

        .rating-display {
            margin-top: var(--space-8);
            font-size: 14px;
            color: var(--color-text-secondary);
        }

        .btn {
            width: 100%;
            padding: var(--space-12) var(--space-20);
            background-color: var(--color-primary);
            color: white;
            border: none;
            border-radius: var(--radius-base);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--color-primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .success-message {
            display: none;
            padding: var(--space-12);
            background-color: rgba(34, 197, 76, 0.1);
            color: var(--color-success);
            border-radius: var(--radius-base);
            margin-bottom: var(--space-16);
            font-size: 14px;
            border-left: 4px solid var(--color-success);
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reviews-section {
            background-color: var(--color-surface);
            padding: var(--space-24);
            border-radius: var(--radius-base);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .reviews-container {
            display: flex;
            flex-direction: column;
            gap: var(--space-16);
            max-height: 600px;
            overflow-y: auto;
            padding-right: var(--space-8);
        }

        .reviews-container::-webkit-scrollbar {
            width: 6px;
        }

        .reviews-container::-webkit-scrollbar-track {
            background: #F5F5F5;
            border-radius: var(--radius-base);
        }

        .reviews-container::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: var(--radius-base);
        }

        .reviews-container::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        .review-card {
            background-color: #FAFAFA;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-base);
            padding: var(--space-16);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .review-username {
            font-weight: 600;
            font-size: 16px;
            color: var(--color-text);
        }

        .review-rating {
            color: var(--color-yellow);
            font-size: 18px;
            letter-spacing: 2px;
        }

        .review-time {
            font-size: 12px;
            color: var(--color-text-secondary);
            margin-bottom: var(--space-12);
        }

        .review-comment {
            font-size: 14px;
            color: var(--color-text);
            line-height: 1.6;
            word-wrap: break-word;
        }

        .empty-message {
            text-align: center;
            padding: var(--space-24);
            color: var(--color-text-secondary);
            font-style: italic;
        }

        .clear-btn {
            width: 100%;
            padding: var(--space-12);
            background-color: #E8E8E8;
            color: var(--color-text);
            border: none;
            border-radius: var(--radius-base);
            font-size: 14px;
            cursor: pointer;
            margin-top: var(--space-16);
            transition: background-color 0.2s;
        }

        .clear-btn:hover {
            background-color: #D0D0D0;
        }

        .review-count {
            text-align: center;
            color: var(--color-text-secondary);
            font-size: 13px;
            margin-top: var(--space-12);
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 24px;
            }

            .stars-container {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Form Section -->
        <div class="form-section">
            <h1>Share Your Review</h1>

            <div class="success-message" id="successMessage">
                ✓ Review submitted successfully!
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="comment">Comment</label>
                <textarea id="comment" placeholder="Share your experience..." required></textarea>
            </div>

            <div class="rating-group">
                <label>Rating</label>
                <div class="stars-container" id="starsContainer">
                    <span class="star" data-rating="1">★</span>
                    <span class="star" data-rating="2">★</span>
                    <span class="star" data-rating="3">★</span>
                    <span class="star" data-rating="4">★</span>
                    <span class="star" data-rating="5">★</span>
                </div>
                <div class="rating-display" id="ratingDisplay">Select a rating</div>
            </div>

            <button class="btn" id="submitBtn">Submit Review</button>
        </div>

        <!-- Reviews Display Section -->
        <div class="reviews-section">
            <h2>Recent Reviews</h2>
            <div class="reviews-container" id="reviewsContainer">
                <div class="empty-message">No reviews yet. Be the first to review!</div>
            </div>
            <div class="review-count" id="reviewCount"></div>
            <button class="clear-btn" id="clearBtn">Clear All Reviews</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'reviews';
        let currentRating = 0;

        // DOM Elements
        const usernameInput = document.getElementById('username');
        const commentInput = document.getElementById('comment');
        const starsContainer = document.getElementById('starsContainer');
        const ratingDisplay = document.getElementById('ratingDisplay');
        const submitBtn = document.getElementById('submitBtn');
        const reviewsContainer = document.getElementById('reviewsContainer');
        const successMessage = document.getElementById('successMessage');
        const clearBtn = document.getElementById('clearBtn');
        const reviewCount = document.getElementById('reviewCount');

        // Initialize
        loadReviews();

        // Star Rating Logic
        starsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('star')) {
                currentRating = parseInt(e.target.dataset.rating);
                updateStarDisplay();
            }
        });

        starsContainer.addEventListener('mouseover', (e) => {
            if (e.target.classList.contains('star')) {
                const hoverRating = parseInt(e.target.dataset.rating);
                document.querySelectorAll('.star').forEach((star, index) => {
                    star.classList.toggle('active', index < hoverRating);
                });
            }
        });

        starsContainer.addEventListener('mouseout', () => {
            updateStarDisplay();
        });

        function updateStarDisplay() {
            document.querySelectorAll('.star').forEach((star, index) => {
                star.classList.toggle('active', index < currentRating);
            });
            ratingDisplay.textContent = currentRating > 0 ? `${currentRating} Star${currentRating !== 1 ? 's' : ''}` : 'Select a rating';
        }

        // Submit Review
        submitBtn.addEventListener('click', () => {
            const username = usernameInput.value.trim();
            const comment = commentInput.value.trim();

            if (!username) {
                alert('Please enter your username');
                return;
            }

            if (!comment) {
                alert('Please enter a comment');
                return;
            }

            if (currentRating === 0) {
                alert('Please select a rating');
                return;
            }

            const review = {
                id: Date.now(),
                username,
                comment,
                rating: currentRating,
                timestamp: new Date().toLocaleString('en-IN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                })
            };

            addReview(review);
            resetForm();
            showSuccessMessage();
        });

        function resetForm() {
            usernameInput.value = '';
            commentInput.value = '';
            currentRating = 0;
            updateStarDisplay();
        }

        function showSuccessMessage() {
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }

        // Local Storage Operations
        function addReview(review) {
            const reviews = getReviews();
            reviews.unshift(review);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(reviews));
            loadReviews();
        }

        function getReviews() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : [];
        }

        function loadReviews() {
            const reviews = getReviews();
            reviewsContainer.innerHTML = '';

            if (reviews.length === 0) {
                reviewsContainer.innerHTML = '<div class="empty-message">No reviews yet. Be the first to review!</div>';
                reviewCount.textContent = '';
                return;
            }

            reviews.forEach(review => {
                const reviewCard = createReviewCard(review);
                reviewsContainer.appendChild(reviewCard);
            });

            reviewCount.textContent = `${reviews.length} review${reviews.length !== 1 ? 's' : ''} total`;
        }

        function createReviewCard(review) {
            const card = document.createElement('div');
            card.className = 'review-card';
            card.innerHTML = `
                <div class="review-header">
                    <span class="review-username">${escapeHtml(review.username)}</span>
                    <span class="review-rating">${'★'.repeat(review.rating)}</span>
                </div>
                <div class="review-time">${review.timestamp}</div>
                <div class="review-comment">${escapeHtml(review.comment)}</div>
            `;
            return card;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Clear All Reviews
        clearBtn.addEventListener('click', () => {
            if (reviews.length === 0) return;
            if (confirm('Are you sure you want to delete all reviews? This action cannot be undone.')) {
                localStorage.removeItem(STORAGE_KEY);
                loadReviews();
            }
        });
    </script>
</body>
</html>
